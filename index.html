<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>投資組合</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;
  --green:#30d158;--red:#ff453a;--blue:#0a84ff;--orange:#ff9f0a;
  --text:#fff;--t2:#8e8e93;--border:#38383a;
  --sb:env(safe-area-inset-bottom,0px)
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;padding-bottom:calc(62px + var(--sb))}
.hdr{padding:52px 18px 14px;background:#0a0a0a}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hdr-title{font-size:19px;font-weight:700}
.hdr-btns{display:flex;gap:8px}
.ico{background:var(--c2);border:none;color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ico.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.net-lbl{font-size:12px;color:var(--t2);margin-bottom:3px}
.net-amt{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.net-chg{font-size:13px;margin-top:5px;min-height:18px;font-variant-numeric:tabular-nums}
.net-upd{font-size:11px;color:var(--t2);margin-top:4px}
.subs{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sc{background:var(--c1);border-radius:10px;padding:9px 13px;min-width:110px;flex-shrink:0}
.sc-l{font-size:11px;color:var(--t2);margin-bottom:3px}
.sc-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;padding:4px 14px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--c1);border:none;color:var(--t2);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.on{background:var(--blue);color:#fff}
.list{padding:0 13px 6px}
.sec{font-size:11px;color:var(--t2);padding:13px 4px 7px;font-weight:600;letter-spacing:.7px;text-transform:uppercase}
.card{background:var(--c1);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.card.tap{cursor:pointer}
.card.tap:active{opacity:.65}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ct{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cs{font-size:17px;font-weight:700}
.bdg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.bdg-m{background:var(--orange);color:#000}
.bdg-a{background:var(--blue);color:#fff}
.cname{font-size:12px;color:var(--t2);margin-top:2px}
.cbkr{font-size:11px;color:var(--t2);background:var(--c2);padding:3px 8px;border-radius:6px;white-space:nowrap;text-align:right}
.pr-row{display:flex;align-items:baseline;gap:6px;margin:2px 0}
.pr-lbl{font-size:12px;color:var(--t2);width:30px;flex-shrink:0}
.pr-big{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pr-mid{font-size:15px;font-weight:500;color:var(--t2);font-variant-numeric:tabular-nums}
.pr-chg{font-size:13px;font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;border-top:1px solid var(--border);padding-top:9px;margin-top:9px}
.ml{font-size:11px;color:var(--t2);margin-bottom:2px}
.mv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}
.mbox{background:rgba(255,159,10,.07);border:1px solid rgba(255,159,10,.2);border-radius:9px;padding:9px 11px;margin-top:9px}
.mbox-title{font-size:11px;color:var(--orange);font-weight:600;margin-bottom:7px}
.mrow{display:flex;justify-content:space-between;padding:2.5px 0;font-size:12px;font-variant-numeric:tabular-nums}
.mrow.hl{font-weight:700;font-size:13px;border-top:1px solid rgba(255,159,10,.2);margin-top:4px;padding-top:6px}
.green{color:var(--green)}.red{color:var(--red)}.dim{color:var(--t2)}
.empty{text-align:center;padding:70px 20px;color:var(--t2)}
.ei{font-size:48px;margin-bottom:14px}
/* ── CALENDAR ── */
#calView{display:none;padding:0 13px 10px}
.cal-top{background:var(--c1);border-radius:14px;padding:16px;margin:6px 0 10px}
.cal-top-lbl{font-size:12px;color:var(--t2);margin-bottom:4px}
.cal-top-amt{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.cal-top-row{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap}
.ctl{font-size:11px;color:var(--t2);margin-bottom:2px}
.ctv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.psel{display:flex;gap:6px;margin:0 0 10px}
.ps{flex:1;padding:8px 0;background:var(--c2);border:none;color:var(--t2);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-align:center}
.ps.on{background:var(--blue);color:#fff}
.psum{background:var(--c1);border-radius:12px;padding:13px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.psum-l{font-size:13px;color:var(--t2)}
.psum-v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-card{background:var(--c1);border-radius:14px;padding:12px 12px 14px}
.cal-sec{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:10px}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cal-month{font-size:15px;font-weight:700}
.cal-nav{background:var(--c2);border:none;color:var(--blue);width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:10px;color:var(--t2);text-align:center;padding:3px 0;font-weight:600}
.cal-day{border-radius:7px;min-height:50px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal-day.profit{background:rgba(48,209,88,.14)}
.cal-day.loss{background:rgba(255,69,58,.13)}
.cal-day.today-ring{outline:2px solid var(--blue)}
.cal-dn{font-size:11px;font-weight:600}
.cal-pnl{font-size:9px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.3;word-break:break-all}
.cal-note{font-size:11px;color:var(--t2);text-align:center;margin-top:12px;line-height:1.6}
/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:flex;padding-bottom:var(--sb);z-index:50}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:3px;background:none;border:none;cursor:pointer;color:var(--t2);font-size:10px;font-weight:500}
.bn.on{color:var(--blue)}
.bn-ico{font-size:22px;line-height:1}
.fab{position:fixed;bottom:calc(70px + var(--sb));right:18px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(10,132,255,.5);display:flex;align-items:center;justify-content:center;z-index:60}
/* ── MODALS ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;align-items:flex-end}
.ov.open{display:flex}
.modal{background:#1c1c1e;border-radius:20px 20px 0 0;padding:6px 18px calc(22px + var(--sb));width:100%;max-height:93vh;overflow-y:auto}
.mh{width:38px;height:4px;background:var(--border);border-radius:2px;margin:11px auto 18px}
.mt{font-size:18px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:13px}
.fl{font-size:13px;color:var(--t2);margin-bottom:5px;display:block}
.fi{width:100%;background:var(--c2);border:none;border-radius:10px;padding:12px 13px;color:var(--text);font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.fi:focus{outline:2px solid var(--blue)}
textarea.fi{resize:vertical;min-height:90px;font-size:13px;font-family:monospace}
.fi-hint{font-size:12px;color:var(--t2);margin-top:4px;line-height:1.5}
.mkt{display:flex;gap:8px}
.mb{flex:1;padding:11px;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--t2);font-size:15px;cursor:pointer;font-weight:500}
.mb.on{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,.08)}
.trow{display:flex;align-items:center;justify-content:space-between;background:var(--c2);padding:12px 13px;border-radius:10px;cursor:pointer}
.sw{width:51px;height:31px;background:var(--border);border-radius:16px;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--green)}
.sw::after{content:'';position:absolute;width:27px;height:27px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw.on::after{left:22px}
.hdn{display:none!important}
.acts{display:flex;gap:9px;margin-top:22px}
.btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.bp{background:var(--blue);color:#fff}
.bs{background:var(--c2);color:var(--text)}
.bd{background:var(--red);color:#fff}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div class="hdr-title" id="hdrTitle">投資組合</div>
    <div class="hdr-btns">
      <button class="ico" id="refBtn" onclick="fetchPrices()">↻</button>
      <button class="ico" onclick="openSettings()">⚙</button>
    </div>
  </div>
  <div class="net-lbl" id="netLbl">總淨值（台幣）</div>
  <div class="net-amt" id="netAmt">—</div>
  <div class="net-chg" id="netChg"></div>
  <div class="net-upd" id="netUpd"></div>
</div>

<div class="subs" id="subs"></div>
<div class="tabs" id="brokerTabs" style="display:none"></div>

<div id="portView" style="display:none">
  <div class="list" id="list"></div>
</div>

<div id="calView">
  <!-- Bitget-style 頂部 -->
  <div class="cal-top">
    <div class="cal-top-lbl">總未實現損益（台幣）</div>
    <div class="cal-top-amt" id="calTotalPnl">—</div>
    <div class="cal-top-row">
      <div><div class="ctl">今日損益</div><div class="ctv" id="calTodayPnl">—</div></div>
      <div><div class="ctl">今日 %</div><div class="ctv" id="calTodayPct">—</div></div>
    </div>
  </div>

  <!-- 期間選擇 -->
  <div class="psel">
    <button class="ps on" data-p="7"  onclick="setPeriod(7)">7天</button>
    <button class="ps"    data-p="30" onclick="setPeriod(30)">30天</button>
    <button class="ps"    data-p="90" onclick="setPeriod(90)">90天</button>
    <button class="ps"    data-p="all" onclick="setPeriod('all')">全部</button>
  </div>

  <!-- 期間小計 -->
  <div class="psum">
    <div class="psum-l" id="psumLbl">近 7 天損益</div>
    <div class="psum-v" id="psumVal">—</div>
  </div>

  <!-- 日曆 -->
  <div class="cal-card">
    <div class="cal-sec">每日盈虧</div>
    <div class="cal-nav-row">
      <button class="cal-nav" onclick="calNav(-1)">‹</button>
      <div class="cal-month" id="calMonth"></div>
      <button class="cal-nav" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-note" id="calNote">每天開啟 App 自動記錄當日漲跌損益<br>從今天開始，資料每日累積</div>
  </div>
</div>

<div class="bnav">
  <button class="bn" id="bn0" onclick="setView('port')"><div class="bn-ico">📊</div>持股</button>
  <button class="bn" id="bn1" onclick="setView('cal')"><div class="bn-ico">📅</div>每日盈虧</button>
</div>
<button class="fab" id="fab" onclick="openModal()" style="display:none">＋</button>

<!-- 新增/編輯 持股 Modal -->
<div class="ov" id="hOv" onclick="bgc(event,'hOv')">
<div class="modal">
  <div class="mh"></div>
  <div class="mt" id="hTit">新增持股</div>
  <div class="fg"><label class="fl">市場</label>
    <div class="mkt">
      <button class="mb on" id="btnTW" onclick="setMkt('TW')">🇹🇼 台股 TWD</button>
      <button class="mb"    id="btnUS" onclick="setMkt('US')">🇺🇸 美股 USD</button>
    </div>
  </div>
  <div class="fg"><label class="fl">券商</label>
    <select class="fi" id="fBk">
      <option value="">請選擇券商…</option>
      <option value="永豐金">永豐金</option>
      <option value="群益">群益</option>
      <option value="元大">元大</option>
      <option value="其他">其他</option>
    </select>
  </div>
  <div class="fg"><label class="fl">股票代碼</label>
    <input class="fi" id="fTk" type="text" placeholder="台股：00685L　美股：NVDA" autocapitalize="characters" autocorrect="off" autocomplete="off">

    <input class="fi" id="fCo" type="number" inputmode="decimal" placeholder="0.00">
  </div>
  <div class="fg">
    <div class="trow" onclick="togM()">
      <div>
        <div style="font-size:15px;font-weight:500">融資部位</div>
        <div style="font-size:12px;color:var(--t2);margin-top:2px">開啟後請填入券商借款金額</div>
      </div>
      <div class="sw" id="mSw"></div>
    </div>
  </div>
  <div class="fg hdn" id="lGrp">
    <label class="fl">融資借款金額（券商借你的錢）</label>

      自投本金 = 持股數 × 平均成本 − 融資借款<br>

  </div>
</div>
</div>

<!-- 設定 Modal -->
<div class="ov" id="sOv" onclick="bgc(event,'sOv')">
<div class="modal">
  <div class="mh"></div>
  <div class="mt">設定</div>
  <div class="fg"><label class="fl">匯入資料（貼上 JSON 陣列）</label>
    <textarea class="fi" id="impJ" placeholder="貼上 JSON 陣列…"></textarea>
  </div>
  <button class="btn bp" style="width:100%;margin-bottom:14px" onclick="doImport()">匯入</button>
  <hr class="divider">

    <textarea class="fi" id="expJ" readonly onclick="this.select()"></textarea>
  </div>

  <hr class="divider">
  <button class="btn bd" style="width:100%;margin-bottom:14px" onclick="clearAll()">清除所有資料</button>
  <button class="btn bs" style="width:100%" onclick="closeSettings()">關閉</button>
</div>
</div>

<script>
/* ══ STATE ══ */
const SK='portfolio_v4', CK='pnl_log_v2';
const PROXIES=[
  u=>u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
];
let H=[],P={},rate=null,editId=null,fMkt='TW',fMargin=false;
let curTab='all',curView='port',curPeriod=7;
let calY=new Date().getFullYear(),calM=new Date().getMonth();

/* ══ STORAGE ══ */
function load(){try{H=JSON.parse(localStorage.getItem(SK))||[];}catch{H=[];}}
function persist(){localStorage.setItem(SK,JSON.stringify(H));}
function getPnlLog(){try{return JSON.parse(localStorage.getItem(CK))||{};}catch{return{};}}
function savePnlLog(l){localStorage.setItem(CK,JSON.stringify(l));}

/* ══ YAHOO TICKER ══ */
function yt(h){return h.market==='TW'?h.ticker+'.TW':h.ticker;}

/* ══ FETCH PRICES ══ */
function abrt(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}

async function fetchOne(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=2d`;
  for(const px of PROXIES){
    try{
      const r=await fetch(px(url),{signal:abrt(7000)});
      if(!r.ok)continue;
      const j=await r.json();
      const m=j.chart?.result?.[0]?.meta;
      if(!m||m.regularMarketPrice==null)continue;
      const curr=m.regularMarketPrice;
      const prev=m.chartPreviousClose??m.previousClose??m.regularMarketPreviousClose??curr;
      return{price:curr,prev,chg:curr-prev,chgPct:prev?((curr-prev)/prev*100):0,currency:m.currency};
    }catch{continue;}
  }
  return null;
}

async function fetchPrices(){
  if(!H.length)return;
  const btn=document.getElementById('refBtn');
  btn.classList.add('spin');
  document.getElementById('netUpd').textContent='更新中…';
  const syms=[...new Set(H.map(yt)),'USDTWD=X'];
  const res=await Promise.all(syms.map(s=>fetchOne(s).then(d=>[s,d])));
  P={};res.forEach(([s,d])=>{if(d)P[s]=d;});
  rate=P['USDTWD=X']?.price||null;
  const ok=res.filter(([,d])=>d).length;
  const t=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('netUpd').textContent=`更新：${t}（${ok}/${syms.length}）`;
  btn.classList.remove('spin');
  logToday();
  render();
}

/* ══ CALC ══ */
function calc(h){
  const pd=P[yt(h)];
  if(!pd)return{...h,pd:null,curr:null,mv:null,nv:null,tc:null,sf:null,pnl:null,pnlPct:null,dayAmt:null};
  const curr=pd.price,mv=h.shares*curr,tc=h.shares*h.avgCost;
  const loan=h.isMargin?(h.marginLoan||0):0;
  const sf=tc-loan,nv=mv-loan;
  const pnl=nv-sf,pnlPct=sf>0?pnl/sf*100:0;
  const dayAmt=(curr-pd.prev)*h.shares;
  return{...h,pd,curr,mv,nv,tc,sf,pnl,pnlPct,dayAmt};
}

/* ══ AGGREGATE ══ */
function agg(list){
  const map=new Map();
  list.forEach(h=>{
    const k=h.market+':'+h.ticker;
    if(!map.has(k)){
      map.set(k,{...h,id:'agg:'+k,_tc:h.shares*h.avgCost,_loan:h.marginLoan||0,_bkrs:new Set([h.broker])});
    }else{
      const e=map.get(k);
      e.shares+=h.shares;e._tc+=h.shares*h.avgCost;e._loan+=h.marginLoan||0;
      e.avgCost=e._tc/e.shares;e.marginLoan=e._loan;
      e.isMargin=e.isMargin||h.isMargin;e._bkrs.add(h.broker);
    }
  });
  return[...map.values()].map(e=>({...e,broker:[...e._bkrs].join('+')}));
}

/* ══ LOG TODAY ══ */
function logToday(){
  let twD=0,usD=0,has=false;
  H.map(calc).forEach(c=>{
    if(c.dayAmt==null)return;has=true;
    c.market==='TW'?twD+=c.dayAmt:usD+=c.dayAmt;
  });
  if(!has)return;
  const total=twD+(rate?usD*rate:0);
  const today=new Date().toISOString().slice(0,10);
  const log=getPnlLog();
  log[today]={pnl:Math.round(total),ts:Date.now()};
  savePnlLog(log);
}

/* ══ FORMAT ══ */
function f(n,d=0){if(n==null||isNaN(n))return'—';return n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fp(n,d=2){if(n==null)return'';return(n>=0?'+':'')+n.toFixed(d)+'%';}
function cc(n){return n==null?'':n>=0?'green':'red';}
function fk(n){if(n==null)return'—';const a=Math.abs(n);const p=n>=0?'+':'-';return a>=10000?p+(a/10000).toFixed(1)+'萬':(n>=0?'+':'')+f(n);}

/* ══ TOTALS ══ */
function getTotals(broker){
  const src=broker&&broker!=='all'?H.filter(h=>h.broker===broker):H;
  let twN=0,usN=0,twD=0,usD=0,twC=0,usC=0,has=false;
  src.map(calc).forEach(c=>{
    if(c.nv==null)return;has=true;
    if(c.market==='TW'){twN+=c.nv;twD+=c.dayAmt||0;twC+=c.tc||0;}
    else{usN+=c.nv;usD+=c.dayAmt||0;usC+=c.tc||0;}
  });
  const r=rate||0;
  const grand=twN+usN*r,grandD=twD+usD*r,grandC=twC+usC*r;
  return{twN,usN,grand,grandD,grandC,totalPnl:grand-grandC,has};
}

/* ── CARD ── */

  const dStr=c.pd?`<span class="${cc(c.pd.chg)}">${c.pd.chg>=0?'+':''}${f(c.pd.chg,2)} (${fp(c.pd.chgPct)})</span>`:'<span class="dim">—</span>';
  const mBdg=c.isMargin?'<span class="bdg bdg-m">融資</span>':'';
  const aBdg=isAgg?'<span class="bdg bdg-a">合計</span>':'';
  const netLbl=c.isMargin?'淨值':'市值';
  const netV=c.nv!=null?`${ccy}${f(c.nv)}`:'—';
  const pnlV=c.pnl!=null?`<span class="${cc(c.pnl)}">${c.pnl>=0?'+':''}${f(c.pnl)}</span>`:'—';
  const pctS=c.pnlPct!=null?`<br><span class="${cc(c.pnlPct)}" style="font-size:11px">${fp(c.pnlPct)}</span>`:'';
  let mbox='';
  if(c.isMargin){
    mbox=`<div class="mbox"><div class="mbox-title">融資明細</div>
      <div class="mrow"><span>自投本金</span><span>${c.sf!=null?f(c.sf):'—'}</span></div>
      <div class="mrow"><span>融資借款</span><span class="red">${f(c.marginLoan)}</span></div>
      <div class="mrow"><span>市值</span><span>${c.mv!=null?f(c.mv):'—'}</span></div>
      <div class="mrow hl"><span>自有淨值</span><span class="${cc(c.nv)}">${c.nv!=null?f(c.nv):'—'}</span></div>
    </div>`;
  }
  const onclick=isAgg?'':`onclick="openModal('${c.id}')"`;
  return`<div class="card${isAgg?'':' tap'}" ${onclick}>
    <div class="ch">
      <div><div class="ct"><span class="cs">${c.ticker}</span>${mBdg}${aBdg}</div><div class="cname">${c.name}</div></div>
      <div class="cbkr">${c.broker}</div>
    </div>
    <div class="pr-row"><span class="pr-lbl">今日</span><span class="pr-big">${pStr}</span><span class="pr-chg">&nbsp;${dStr}</span></div>
    <div class="pr-row"><span class="pr-lbl">成本</span><span class="pr-mid">${ccy}${f(c.avgCost,2)}</span></div>
    <div class="metrics">
      <div><div class="ml">持股數</div><div class="mv">${f(c.shares,dec)}</div></div>
      <div><div class="ml">${netLbl}</div><div class="mv">${netV}</div></div>

}

/* ══ CALENDAR ══ */
function setPeriod(p){
  curPeriod=p;
  document.querySelectorAll('.ps').forEach(b=>b.classList.toggle('on',String(b.dataset.p)===String(p)));
  renderCalendar();
}

function periodPnl(days){
  const log=getPnlLog(),today=new Date();
  let sum=0,cnt=0;
  const limit=days==='all'?3650:days;
  for(let i=0;i<limit;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    if(log[k]){sum+=log[k].pnl;cnt++;}
  }
  return{sum,cnt};
}

function renderCalendar(){
  const log=getPnlLog();
  const todayKey=new Date().toISOString().slice(0,10);
  const ta=getTotals(null);

  // 頂部：總未實現損益
  const tp=document.getElementById('calTotalPnl');
  tp.textContent=ta.has?`${ta.totalPnl>=0?'+':''}NT$ ${f(ta.totalPnl)}`:'—';
  tp.className='cal-top-amt '+cc(ta.totalPnl);

  // 今日
  const te=log[todayKey];
  if(te){
    const td=te.pnl;
    document.getElementById('calTodayPnl').innerHTML=`<span class="${cc(td)}">${td>=0?'+':''}NT$ ${f(td)}</span>`;
    document.getElementById('calTodayPct').innerHTML=`<span class="${cc(td)}">${ta.grand?fp(td/ta.grand*100):'—'}</span>`;
  }else{
    document.getElementById('calTodayPnl').textContent='—';
    document.getElementById('calTodayPct').textContent='—';
  }

  // 期間小計
  const pd=periodPnl(curPeriod);
  const plbl=curPeriod==='all'?`全部（${pd.cnt} 天記錄）`:`近 ${curPeriod} 天`;
  document.getElementById('psumLbl').textContent=plbl;
  const pv=document.getElementById('psumVal');
  if(pd.cnt){pv.textContent=`${pd.sum>=0?'+':''}NT$ ${f(pd.sum)}`;pv.className=`psum-v ${cc(pd.sum)}`;}
  else{pv.textContent='尚無記錄';pv.className='psum-v dim';}

  // 月份標題
  const mN=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonth').textContent=`${calY} ${mN[calM]}`;

  // 日曆格子
  const fDow=new Date(calY,calM,1).getDay();
  const lastD=new Date(calY,calM+1,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  let g='<div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>';
  for(let i=0;i<fDow;i++)g+='<div></div>';
  let hasAny=false;
  for(let d=1;d<=lastD;d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const e=log[ds];if(e)hasAny=true;
    const isToday=ds===todayStr;
    let cls='cal-day';
    if(e)cls+=e.pnl>=0?' profit':' loss';
    if(isToday)cls+=' today-ring';
    const pStr=e?fk(e.pnl):'';
    const pCls=e?cc(e.pnl):'dim';
    g+=`<div class="${cls}"><div class="cal-dn">${d}</div><div class="cal-pnl ${pCls}">${pStr}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML=g;
  document.getElementById('calNote').style.display=hasAny?'none':'block';
}

function calNav(d){calM+=d;if(calM<0){calM=11;calY--;}else if(calM>11){calM=0;calY++;}renderCalendar();}

/* ══ MODAL ══ */
function openModal(id=null){
  editId=id;
  document.getElementById('hTit').textContent=id?'編輯持股':'新增持股';
  document.getElementById('delBtn').classList.toggle('hdn',!id);
  if(id){
    const h=H.find(x=>x.id===id);if(!h)return;
    setMkt(h.market);
    document.getElementById('fBk').value=h.broker;
    document.getElementById('fTk').value=h.ticker;
    document.getElementById('fNm').value=h.name;
    document.getElementById('fSh').value=h.shares;
    document.getElementById('fCo').value=h.avgCost;
    fMargin=h.isMargin;
    document.getElementById('fLo').value=h.isMargin?h.marginLoan:'';
  }else{
    setMkt('TW');
    document.getElementById('fBk').value='';
    ['fTk','fNm','fSh','fCo','fLo'].forEach(i=>document.getElementById(i).value='');
    fMargin=false;
  }
  updM();
  document.getElementById('hOv').classList.add('open');
}
function closeModal(){document.getElementById('hOv').classList.remove('open');editId=null;}
function bgc(e,id){if(e.target===e.currentTarget)document.getElementById(id).classList.remove('open');}
function setMkt(m){fMkt=m;document.getElementById('btnTW').classList.toggle('on',m==='TW');document.getElementById('btnUS').classList.toggle('on',m==='US');}
function togM(){fMargin=!fMargin;updM();}
function updM(){document.getElementById('mSw').classList.toggle('on',fMargin);document.getElementById('lGrp').classList.toggle('hdn',!fMargin);}

function saveH(){
  const bk=document.getElementById('fBk').value;
  const tk=document.getElementById('fTk').value.trim().toUpperCase();
  const nm=document.getElementById('fNm').value.trim();
  const sh=parseFloat(document.getElementById('fSh').value);
  const co=parseFloat(document.getElementById('fCo').value);
  const lo=fMargin?parseFloat(document.getElementById('fLo').value)||0:0;
  if(!bk||!tk||!nm||isNaN(sh)||sh<=0||isNaN(co)||co<=0){alert('請填寫所有必填欄位');return;}
  const e={broker:bk,ticker:tk,name:nm,market:fMkt,shares:sh,avgCost:co,isMargin:fMargin,marginLoan:lo};
  if(editId){const i=H.findIndex(h=>h.id===editId);if(i!==-1)H[i]={...H[i],...e};}
  else H.push({id:Date.now()+Math.random().toString(36).slice(2,5),...e});
  persist();closeModal();render();fetchPrices();
}
function delH(){if(!editId||!confirm('確定刪除這筆持股？'))return;H=H.filter(h=>h.id!==editId);persist();closeModal();render();}
