<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>投資組合</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;
      --green:#30d158;--red:#ff453a;--blue:#0a84ff;
      --orange:#ff9f0a;--text:#fff;--text2:#8e8e93;
      --border:#38383a;--safe:env(safe-area-inset-bottom,0px)
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;padding-bottom:calc(90px + var(--safe))}

    .hdr{padding:56px 20px 16px;background:#111}
    .hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .hdr-title{font-size:22px;font-weight:700}
    .hdr-btns{display:flex;gap:8px}
    .ico-btn{background:var(--card2);border:none;color:var(--blue);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .ico-btn.spin{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .total-lbl{font-size:13px;color:var(--text2);margin-bottom:4px}
    .total-amt{font-size:38px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
    .total-chg{font-size:15px;margin-top:6px;min-height:22px}
    .upd{font-size:12px;color:var(--text2);margin-top:6px}

    .subs{display:flex;gap:10px;padding:12px 20px;overflow-x:auto;scrollbar-width:none}
    .subs::-webkit-scrollbar{display:none}
    .sub{background:var(--card);border-radius:12px;padding:11px 14px;min-width:130px;flex-shrink:0}
    .sub-lbl{font-size:11px;color:var(--text2);margin-bottom:4px}
    .sub-val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

    .tabs{display:flex;gap:8px;padding:4px 20px 8px;overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{background:var(--card);border:none;color:var(--text2);padding:7px 16px;border-radius:20px;font-size:14px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-weight:500}
    .tab.on{background:var(--blue);color:#fff}

    .list{padding:0 16px}
    .sec-lbl{font-size:12px;color:var(--text2);padding:16px 4px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}

    .card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
    .card.tap{cursor:pointer}
    .card.tap:active{opacity:.65}
    .card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .sym{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--orange);color:#000}
    .badge-agg{background:var(--blue);color:#fff}
    .sname{font-size:13px;color:var(--text2);margin-top:2px}
    .bkr{font-size:12px;color:var(--text2);background:var(--card2);padding:3px 9px;border-radius:6px;flex-shrink:0;max-width:120px;text-align:right;line-height:1.4}
    .price-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
    .price{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
    .dchg{font-size:14px;font-variant-numeric:tabular-nums}
    .metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-top:1px solid var(--border);padding-top:10px}
    .mlbl{font-size:11px;color:var(--text2);margin-bottom:3px}
    .mval{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
    .mval.sm{font-size:12px}
    .mbox{background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.25);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:12px}
    .mrow{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}
    .mrow.tot{border-top:1px solid rgba(255,159,10,.2);margin-top:4px;padding-top:6px;font-weight:600;font-size:13px}
    .green{color:var(--green)}
    .red{color:var(--red)}

    .empty{text-align:center;padding:80px 20px;color:var(--text2)}
    .empty-ico{font-size:52px;margin-bottom:16px}

    .fab{position:fixed;bottom:calc(28px + var(--safe));right:24px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(10,132,255,.45);display:flex;align-items:center;justify-content:center;z-index:100}

    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:flex-end}
    .overlay.open{display:flex}
    .modal{background:#1c1c1e;border-radius:20px 20px 0 0;padding:8px 20px calc(28px + var(--safe));width:100%;max-height:92vh;overflow-y:auto}
    .handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 20px}
    .mtit{font-size:18px;font-weight:700;margin-bottom:20px}
    .fg{margin-bottom:16px}
    .flbl{font-size:13px;color:var(--text2);margin-bottom:6px;display:block}
    .finp{width:100%;background:var(--card2);border:none;border-radius:10px;padding:12px 14px;color:var(--text);font-size:16px;outline:none}
    .finp:focus{outline:2px solid var(--blue)}
    textarea.finp{resize:vertical;min-height:120px;font-size:13px;font-family:monospace}
    .mkt-tog{display:flex;gap:8px}
    .mkt-btn{flex:1;padding:11px;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--text2);font-size:15px;cursor:pointer;font-weight:500}
    .mkt-btn.on{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,.1)}
    .tog-row{display:flex;align-items:center;justify-content:space-between;background:var(--card2);padding:12px 14px;border-radius:10px;cursor:pointer}
    .sw{width:51px;height:31px;background:var(--border);border-radius:16px;position:relative;transition:background .2s;flex-shrink:0}
    .sw.on{background:var(--green)}
    .sw::after{content:'';position:absolute;width:27px;height:27px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
    .sw.on::after{left:22px}
    .hint{font-size:12px;color:var(--text2);margin-top:5px}
    .hidden{display:none!important}
    .acts{display:flex;gap:10px;margin-top:24px}
    .btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
    .btn-p{background:var(--blue);color:#fff}
    .btn-s{background:var(--card2);color:var(--text)}
    .btn-d{background:var(--red);color:#fff}
    hr.div{border:none;border-top:1px solid var(--border);margin:20px 0}
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-title">投資組合</div>
    <div class="hdr-btns">
      <button class="ico-btn" id="refBtn" onclick="fetchPrices()">↻</button>
      <button class="ico-btn" onclick="openSettings()">⚙</button>
    </div>
  </div>
  <div class="total-lbl">總淨值（台幣）</div>
  <div class="total-amt" id="totalAmt">—</div>
  <div class="total-chg" id="totalChg"></div>
  <div class="upd" id="upd"></div>
</div>

<div class="subs" id="subs"></div>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<button class="fab" onclick="openModal()">+</button>

<!-- 持股 modal -->
<div class="overlay" id="hOv" onclick="bgClose(event,'hOv')">
  <div class="modal">
    <div class="handle"></div>
    <div class="mtit" id="hTit">新增持股</div>
    <div class="fg"><label class="flbl">市場</label>
      <div class="mkt-tog">
        <button class="mkt-btn on" id="btnTW" onclick="setMkt('TW')">台股 TWD</button>
        <button class="mkt-btn" id="btnUS" onclick="setMkt('US')">美股 USD</button>
      </div>
    </div>
    <div class="fg"><label class="flbl">券商</label><input class="finp" id="fBk" type="text" placeholder="富邦 / 群益 / 國泰 / 永豐金"></div>
    <div class="fg"><label class="flbl">股票代碼</label><input class="finp" id="fTk" type="text" placeholder="台股：00662　美股：NVDA" autocapitalize="characters" autocorrect="off"></div>
    <div class="fg"><label class="flbl">股票名稱</label><input class="finp" id="fNm" type="text" placeholder="例：富邦NASDAQ"></div>
    <div class="fg"><label class="flbl">持股數量</label><input class="finp" id="fSh" type="number" inputmode="decimal" placeholder="0"></div>
    <div class="fg"><label class="flbl">平均成本（每股）</label><input class="finp" id="fCo" type="number" inputmode="decimal" placeholder="0.00"></div>
    <div class="fg"><div class="tog-row" onclick="togM()"><span style="font-size:16px">融資部位</span><div class="sw" id="mSw"></div></div></div>
    <div class="fg hidden" id="lGrp">
      <label class="flbl">融資借款金額</label>
      <input class="finp" id="fLo" type="number" inputmode="numeric" placeholder="0">
      <div class="hint">券商借你的金額（市值 − 融資借款 = 自有淨值）</div>
    </div>
    <div class="acts">
      <button class="btn btn-s" onclick="closeModal()">取消</button>
      <button class="btn btn-d hidden" id="delBtn" onclick="delH()">刪除</button>
      <button class="btn btn-p" onclick="saveH()">儲存</button>
    </div>
  </div>
</div>

<!-- 設定 modal -->
<div class="overlay" id="sOv" onclick="bgClose(event,'sOv')">
  <div class="modal">
    <div class="handle"></div>
    <div class="mtit">設定</div>
    <div class="fg"><label class="flbl">匯入資料（貼上 JSON）</label><textarea class="finp" id="impJ" placeholder="貼上 JSON 陣列…"></textarea></div>
    <button class="btn btn-p" style="width:100%;margin-bottom:20px" onclick="doImport()">匯入</button>
    <hr class="div">
    <div class="fg"><label class="flbl">匯出目前資料</label><textarea class="finp" id="expJ" readonly onclick="this.select()"></textarea></div>
    <button class="btn btn-s" style="width:100%;margin-bottom:20px" onclick="doExport()">產生匯出 JSON</button>
    <hr class="div">
    <button class="btn btn-s" style="width:100%" onclick="closeSettings()">關閉</button>
  </div>
</div>

<script>
const SK='portfolio_v2';
const PROXIES=[
  u=>u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
];

let H=[],P={},rate=null,editId=null,fMkt='TW',fMargin=false,curTab='all';

function load(){try{H=JSON.parse(localStorage.getItem(SK))||[];}catch(e){H=[];}}
function persist(){localStorage.setItem(SK,JSON.stringify(H));}
function yt(h){return h.market==='TW'?h.ticker+'.TW':h.ticker;}

/* Fetch single ticker via chart API + proxy fallback */
function mkAbort(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}
async function fetchTicker(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=2d`;
  for(const px of PROXIES){
    try{
      const r=await fetch(px(url),{signal:mkAbort(7000)});
      if(!r.ok)continue;
      const j=await r.json();
      const m=j.chart?.result?.[0]?.meta;
      if(!m||!m.regularMarketPrice)continue;
      const prev=m.chartPreviousClose??m.previousClose;
      const curr=m.regularMarketPrice;
      return{price:curr,prev,chg:curr-prev,chgPct:prev?(curr-prev)/prev*100:0,currency:m.currency,state:m.marketState};
    }catch(e){continue;}
  }
  return null;
}

async function fetchPrices(){
  if(!H.length)return;
  const btn=document.getElementById('refBtn');
  btn.classList.add('spin');
  document.getElementById('upd').textContent='更新中…';
  const syms=[...new Set(H.map(yt)),'USDTWD=X'];
  const results=await Promise.all(syms.map(s=>fetchTicker(s).then(d=>[s,d])));
  P={};
  results.forEach(([s,d])=>{if(d)P[s]=d;});
  rate=P['USDTWD=X']?.price||null;
  const ok=results.filter(([,d])=>d!=null).length;
  document.getElementById('upd').textContent=ok>1
    ?'更新：'+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'（'+ok+'/'+syms.length+'）'
    :'載入失敗，請稍後再試';
  btn.classList.remove('spin');
  render();
}

/* Calc */
function calc(h){
  const pd=P[yt(h)];
  if(!pd||pd.price==null)return{...h,pd:null};
  const curr=pd.price,mv=h.shares*curr,tc=h.shares*h.avgCost;
  const sf=h.isMargin?tc-h.marginLoan:tc;
  const nv=h.isMargin?mv-h.marginLoan:mv;
  const pnl=mv-tc,pnlPct=sf>0?pnl/sf*100:0;
  const dayAmt=(curr-pd.prev)*h.shares;
  return{...h,pd,curr,mv,nv,tc,sf,pnl,pnlPct,dayAmt};
}

/* Aggregate by ticker (for 全部 tab) */
function aggregate(list){
  const map=new Map();
  list.forEach(h=>{
    const k=h.market+':'+h.ticker;
    if(!map.has(k)){
      map.set(k,{...h,id:'agg:'+k,_tc:h.shares*h.avgCost,_loan:h.marginLoan||0,brokers:new Set([h.broker])});
    }else{
      const e=map.get(k);
      const addTc=h.shares*h.avgCost;
      e.shares+=h.shares;
      e._tc+=addTc;
      e._loan+=(h.marginLoan||0);
      e.avgCost=e._tc/e.shares;
      e.marginLoan=e._loan;
      e.isMargin=e.isMargin||h.isMargin;
      e.brokers.add(h.broker);
    }
  });
  return[...map.values()].map(e=>({...e,broker:[...e.brokers].join('、')}));
}

/* Formats */
function f(n,d=0){if(n==null||isNaN(n))return'—';return n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fp(n){if(n==null)return'';return(n>=0?'+':'')+n.toFixed(2)+'%';}
function cc(n){return n==null?'':n>=0?'green':'red';}

/* Render */
function render(){renderTabs();renderSubs();renderList();}

function renderTabs(){
  const bs=['all',...new Set(H.map(h=>h.broker))];
  document.getElementById('tabs').innerHTML=bs.map(b=>`<button class="tab ${curTab===b?'on':''}" onclick="setTab('${b}')">${b==='all'?'全部':b}</button>`).join('');
}
function setTab(t){curTab=t;render();}

function renderSubs(){
  const cs=H.map(calc);
  let twN=0,usN=0,twD=0,usD=0,has=false;
  cs.forEach(c=>{if(c.nv==null)return;has=true;if(c.market==='TW'){twN+=c.nv;twD+=c.dayAmt||0;}else{usN+=c.nv;usD+=c.dayAmt||0;}});
  const r=rate||0,grand=twN+usN*r,grandD=twD+usD*r;
  document.getElementById('totalAmt').textContent=has?`NT$ ${f(grand)}`:'—';
  document.getElementById('totalChg').innerHTML=has&&grandD!==0?`<span class="${cc(grandD)}">今日 ${grandD>=0?'+':''}${f(grandD)} (${fp(grand?grandD/grand*100:0)})</span>`:'';
  document.getElementById('subs').innerHTML=[
    `<div class="sub"><div class="sub-lbl">台股 TWD</div><div class="sub-val">${has?f(twN):'—'}</div></div>`,
    `<div class="sub"><div class="sub-lbl">美股 USD</div><div class="sub-val">${has?f(usN,2):'—'}</div></div>`,
    rate?`<div class="sub"><div class="sub-lbl">USD/TWD</div><div class="sub-val">${f(rate,3)}</div></div>`:'',
  ].join('');
}

function cardHtml(c,isAgg){
  const cur=c.market==='US'?'$':'';
  const prStr=c.pd?`${cur}${f(c.curr,2)}`:'—';
  const dayStr=c.pd?`<span class="${cc(c.pd.chg)}">${c.pd.chg>=0?'+':''}${f(c.pd.chg,2)} (${fp(c.pd.chgPct)})</span>`:'';
  const dec=c.shares%1!==0?5:0,ccy=c.market==='US'?'US$':'';
  const pnlS=c.pnl!=null?`<span class="${cc(c.pnl)}">${c.pnl>=0?'+':''}${f(c.pnl)}</span>`:'—';
  const pctS=c.pnlPct!=null?`<br><span class="${cc(c.pnlPct)}" style="font-size:11px">${fp(c.pnlPct)}</span>`:'';
  const mb=c.isMargin&&c.mv!=null?`<div class="mbox"><div class="mrow"><span>市值</span><span>${f(c.mv)}</span></div><div class="mrow"><span>融資借款</span><span class="red">－${f(c.marginLoan)}</span></div><div class="mrow tot"><span>自有淨值</span><span>${f(c.nv)}</span></div></div>`:'';
  const tapClass=isAgg?'':'tap';
  const onclick=isAgg?'':`onclick="openModal('${c.id}')"`;
  const aggBadge=isAgg?'<span class="badge badge-agg">合計</span>':'';
  const marginBadge=c.isMargin?'<span class="badge">融資</span>':'';
  return `<div class="card ${tapClass}" ${onclick}>
    <div class="card-hdr">
      <div><div class="sym">${c.ticker}${marginBadge}${aggBadge}</div><div class="sname">${c.name}</div></div>
      <div class="bkr">${c.broker}</div>
    </div>
    <div class="price-row"><div class="price">${prStr}</div><div class="dchg">${dayStr}</div></div>
    <div class="metrics">
      <div><div class="mlbl">持股數</div><div class="mval">${f(c.shares,dec)}</div></div>
      <div><div class="mlbl">${c.isMargin?'淨值':'市值'}</div><div class="mval sm">${c.nv!=null?ccy+f(c.nv):'—'}</div></div>
      <div><div class="mlbl">損益</div><div class="mval sm">${pnlS}${pctS}</div></div>
    </div>${mb}</div>`;
}

function renderList(){
  const el=document.getElementById('list');
  if(!H.length){el.innerHTML='<div class="empty"><div class="empty-ico">📊</div><div>還沒有持股，點右下角 + 新增</div></div>';return;}
  let src,isAgg=false;
  if(curTab==='all'){src=aggregate(H).map(calc);isAgg=true;}
  else src=H.filter(h=>h.broker===curTab).map(calc);
  const tw=src.filter(c=>c.market==='TW'),us=src.filter(c=>c.market==='US');
  el.innerHTML=
    (tw.length?`<div class="sec-lbl">台股</div>${tw.map(c=>cardHtml(c,isAgg)).join('')}`:'')
    +(us.length?`<div class="sec-lbl">美股</div>${us.map(c=>cardHtml(c,isAgg)).join('')}`:'');
}

/* Modal */
function openModal(id=null){
  editId=id;
  document.getElementById('hTit').textContent=id?'編輯持股':'新增持股';
  document.getElementById('delBtn').classList.toggle('hidden',!id);
  if(id){
    const h=H.find(x=>x.id===id);if(!h)return;
    setMkt(h.market);
    document.getElementById('fBk').value=h.broker;
    document.getElementById('fTk').value=h.ticker;
    document.getElementById('fNm').value=h.name;
    document.getElementById('fSh').value=h.shares;
    document.getElementById('fCo').value=h.avgCost;
    fMargin=h.isMargin;document.getElementById('fLo').value=h.isMargin?h.marginLoan:'';
  }else{
    setMkt('TW');['fBk','fTk','fNm','fSh','fCo','fLo'].forEach(i=>document.getElementById(i).value='');fMargin=false;
  }
  updM();document.getElementById('hOv').classList.add('open');
}
function closeModal(){document.getElementById('hOv').classList.remove('open');editId=null;}
function setMkt(m){fMkt=m;document.getElementById('btnTW').classList.toggle('on',m==='TW');document.getElementById('btnUS').classList.toggle('on',m==='US');}
function togM(){fMargin=!fMargin;updM();}
function updM(){document.getElementById('mSw').classList.toggle('on',fMargin);document.getElementById('lGrp').classList.toggle('hidden',!fMargin);}
function saveH(){
  const bk=document.getElementById('fBk').value.trim(),tk=document.getElementById('fTk').value.trim().toUpperCase();
  const nm=document.getElementById('fNm').value.trim(),sh=parseFloat(document.getElementById('fSh').value);
  const co=parseFloat(document.getElementById('fCo').value),lo=fMargin?(parseFloat(document.getElementById('fLo').value)||0):0;
  if(!bk||!tk||!nm||isNaN(sh)||sh<=0||isNaN(co)||co<=0){alert('請填寫所有必填欄位');return;}
  const e={broker:bk,ticker:tk,name:nm,market:fMkt,shares:sh,avgCost:co,isMargin:fMargin,marginLoan:lo};
  if(editId){const i=H.findIndex(h=>h.id===editId);if(i!==-1)H[i]={...H[i],...e};}
  else H.push({id:Date.now()+'-'+Math.random().toString(36).substr(2,5),...e});
  persist();closeModal();render();fetchPrices();
}
function delH(){if(!editId||!confirm('確定要刪除？'))return;H=H.filter(h=>h.id!==editId);persist();closeModal();render();}

/* Settings */
function openSettings(){document.getElementById('sOv').classList.add('open');}
function closeSettings(){document.getElementById('sOv').classList.remove('open');}
