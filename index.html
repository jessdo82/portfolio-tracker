<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>投資組合</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;
  --green:#30d158;--red:#ff453a;--blue:#0a84ff;--orange:#ff9f0a;
  --text:#fff;--t2:#8e8e93;--border:#38383a;
  --sb:env(safe-area-inset-bottom,0px)
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;padding-bottom:calc(64px + var(--sb))}
/* header */
.hdr{padding:52px 18px 14px;background:#080808}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hdr-title{font-size:19px;font-weight:700}
.hdr-btns{display:flex;gap:8px}
.ico{background:var(--c2);border:none;color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ico.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.net-lbl{font-size:12px;color:var(--t2);margin-bottom:3px}
.net-amt{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.net-chg{font-size:13px;margin-top:5px;min-height:18px}
.net-upd{font-size:11px;color:var(--t2);margin-top:4px}
/* sub cards */
.subs{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sc{background:var(--c1);border-radius:10px;padding:9px 13px;min-width:110px;flex-shrink:0}
.sc-l{font-size:11px;color:var(--t2);margin-bottom:3px}
.sc-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
/* broker tabs */
.tabs{display:flex;gap:6px;padding:4px 14px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--c1);border:none;color:var(--t2);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.on{background:var(--blue);color:#fff}
/* list */
.list{padding:0 13px 8px}
.sec{font-size:11px;color:var(--t2);padding:13px 4px 7px;font-weight:600;letter-spacing:.7px}
/* card */
.card{background:var(--c1);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.card.tap:active{opacity:.6}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ct{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cs{font-size:17px;font-weight:700}
.bdg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.bdg-m{background:var(--orange);color:#000}
.bdg-a{background:var(--blue);color:#fff}
.cname{font-size:12px;color:var(--t2);margin-top:2px}
.cbkr{font-size:11px;color:var(--t2);background:var(--c2);padding:3px 8px;border-radius:6px;white-space:nowrap}
.prow{display:flex;align-items:baseline;gap:6px;margin:2px 0}
.plbl{font-size:12px;color:var(--t2);width:30px;flex-shrink:0}
.pbig{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pmid{font-size:15px;font-weight:500;color:var(--t2);font-variant-numeric:tabular-nums}
.pchg{font-size:13px;font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;border-top:1px solid var(--border);padding-top:9px;margin-top:9px}
.ml{font-size:11px;color:var(--t2);margin-bottom:2px}
.mv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}
.mbox{background:rgba(255,159,10,.07);border:1px solid rgba(255,159,10,.2);border-radius:9px;padding:9px 11px;margin-top:9px}
.mbox-title{font-size:11px;color:var(--orange);font-weight:600;margin-bottom:7px}
.mrow{display:flex;justify-content:space-between;padding:2.5px 0;font-size:12px;font-variant-numeric:tabular-nums}
.mrow.hl{font-weight:700;font-size:13px;border-top:1px solid rgba(255,159,10,.2);margin-top:4px;padding-top:6px}
.green{color:var(--green)}.red{color:var(--red)}.dim{color:var(--t2)}
.empty{text-align:center;padding:70px 20px;color:var(--t2)}

/* ════ CALENDAR — Bitget style ════ */
#calView{display:none}

/* top summary */
.cal-summary{background:#111;padding:18px 18px 14px;margin-bottom:0}
.cs-row1{margin-bottom:14px}
.cs-lbl{font-size:12px;color:var(--t2);margin-bottom:4px}
.cs-main{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.cs-row2{display:flex;gap:0}
.cs-item{flex:1}
.cs-item-l{font-size:11px;color:var(--t2);margin-bottom:3px}
.cs-item-v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* period selector — exactly like Bitget tabs */
.psel-wrap{background:#111;padding:0 18px 12px;display:flex;gap:0}
.ps{flex:1;padding:8px 0;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;text-align:center}
.ps.on{color:var(--blue);border-bottom-color:var(--blue)}

/* period total bar */
.ptotal{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#111;border-bottom:1px solid var(--border);margin-bottom:0}
.ptotal-l{font-size:13px;color:var(--t2)}
.ptotal-v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

/* 每日盈虧 section */
.cal-section{background:#111;padding:12px 14px 18px;margin-top:1px}
.cal-section-title{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:12px}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month-txt{font-size:16px;font-weight:700}
.cal-nav-btn{background:var(--c2);border:none;color:var(--blue);width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:10px;color:var(--t2);text-align:center;padding:3px 0;font-weight:600}
.cday{border-radius:7px;min-height:52px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent}
.cday.has{background:var(--c2)}
.cday.profit{background:rgba(48,209,88,.16)}
.cday.loss{background:rgba(255,69,58,.14)}
.cday.today{outline:2px solid var(--blue)}
.cday-n{font-size:11px;font-weight:600}
.cday-p{font-size:9px;text-align:center;line-height:1.3;word-break:break-all;font-variant-numeric:tabular-nums}
.cal-loading{text-align:center;padding:18px;color:var(--t2);font-size:13px}
.cday{cursor:pointer}
.cday.sel{outline:2px solid var(--orange)!important;outline-offset:1px}

/* day detail panel */
.dd-wrap{border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
.dd-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dd-date-txt{font-size:14px;font-weight:700}
.dd-close{background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer;padding:0 2px}
.dd-total{display:flex;justify-content:space-between;align-items:center;background:var(--c2);border-radius:10px;padding:10px 13px;margin-bottom:10px}
.dd-total-l{font-size:12px;color:var(--t2)}
.dd-total-v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.dd-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.dd-row:last-child{border-bottom:none}
.dd-l{display:flex;flex-direction:column;gap:3px}
.dd-sym{font-size:15px;font-weight:700}
.dd-nm{font-size:12px;color:var(--t2)}
.dd-r{text-align:right}
.dd-px{font-size:12px;color:var(--t2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.dd-nv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.dd-pnl{font-size:11px;font-variant-numeric:tabular-nums}
.dd-empty{text-align:center;padding:18px 0;color:var(--t2);font-size:13px}
.dd-note{font-size:11px;color:var(--t2);text-align:center;margin-top:8px}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:flex;padding-bottom:var(--sb);z-index:50}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:3px;background:none;border:none;cursor:pointer;color:var(--t2);font-size:10px;font-weight:500}
.bn.on{color:var(--blue)}
.bn-ico{font-size:22px;line-height:1}
.fab{position:fixed;bottom:calc(70px + var(--sb));right:18px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(10,132,255,.5);display:flex;align-items:center;justify-content:center;z-index:60}

/* modals */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.ov.open{display:flex}
.modal{background:#1c1c1e;border-radius:20px 20px 0 0;padding:6px 18px calc(22px + var(--sb));width:100%;max-height:93vh;overflow-y:auto}
.mh{width:38px;height:4px;background:var(--border);border-radius:2px;margin:11px auto 18px}
.mt{font-size:18px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:13px}
.fl{font-size:13px;color:var(--t2);margin-bottom:5px;display:block}
.fi{width:100%;background:var(--c2);border:none;border-radius:10px;padding:12px 13px;color:var(--text);font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.fi:focus{outline:2px solid var(--blue)}
textarea.fi{resize:vertical;min-height:90px;font-size:13px;font-family:monospace}
.fi-hint{font-size:12px;color:var(--t2);margin-top:4px;line-height:1.5}
.mkt-row{display:flex;gap:8px}
.mb{flex:1;padding:11px;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--t2);font-size:15px;cursor:pointer;font-weight:500}
.mb.on{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,.08)}
.trow{display:flex;align-items:center;justify-content:space-between;background:var(--c2);padding:12px 13px;border-radius:10px;cursor:pointer}
.sw{width:51px;height:31px;background:var(--border);border-radius:16px;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--green)}
.sw::after{content:'';position:absolute;width:27px;height:27px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw.on::after{left:22px}
.hdn{display:none!important}
.acts{display:flex;gap:9px;margin-top:22px}
.btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.bp{background:var(--blue);color:#fff}.bs{background:var(--c2);color:var(--text)}.bd{background:var(--red);color:#fff}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>
<body>

<!-- HEADER (always visible) -->
<div class="hdr">
  <div class="hdr-row">
    <div class="hdr-title" id="hdrTitle">投資組合</div>
    <div class="hdr-btns">
      <button class="ico" id="refBtn" onclick="fetchPrices()">↻</button>
      <button class="ico" onclick="openSettings()">⚙</button>
    </div>
  </div>
  <div class="net-lbl" id="netLbl">總淨值（台幣）</div>
  <div class="net-amt" id="netAmt">—</div>
  <div class="net-chg" id="netChg"></div>
  <div class="net-upd" id="netUpd"></div>
</div>
<div class="subs" id="subs"></div>

<!-- PORTFOLIO VIEW -->
<div id="portView" style="display:none">
  <div class="tabs" id="brokerTabs"></div>
  <div class="list" id="list"></div>
</div>

<!-- CALENDAR VIEW (Bitget-style) -->
<div id="calView">
  <!-- 總未實現損益 -->
  <div class="cal-summary">
    <div class="cs-row1">
      <div class="cs-lbl">總未實現損益（台幣）</div>
      <div class="cs-main" id="csTotalPnl">—</div>
    </div>
    <div class="cs-row2">
      <div class="cs-item">
        <div class="cs-item-l">今日損益</div>
        <div class="cs-item-v" id="csTodayPnl">—</div>
      </div>
      <div class="cs-item">
        <div class="cs-item-l">今日漲跌 %</div>
        <div class="cs-item-v" id="csTodayPct">—</div>
      </div>
    </div>
  </div>

  <!-- 期間選擇 (Bitget 底線樣式) -->
  <div class="psel-wrap">
    <button class="ps on" data-p="7"   onclick="setPeriod(7)">7天</button>
    <button class="ps"    data-p="30"  onclick="setPeriod(30)">30天</button>
    <button class="ps"    data-p="90"  onclick="setPeriod(90)">90天</button>
    <button class="ps"    data-p="all" onclick="setPeriod('all')">全部</button>
  </div>

  <!-- 期間小計 -->
  <div class="ptotal">
    <span class="ptotal-l" id="ptotalLbl">近 7 天損益</span>
    <span class="ptotal-v" id="ptotalVal">—</span>
  </div>

  <!-- 每日盈虧日曆 -->
  <div class="cal-section">
    <div class="cal-section-title">每日盈虧</div>
    <div class="cal-nav-row">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <div class="cal-month-txt" id="calMonth"></div>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-loading" id="calLoading" style="display:none">載入歷史資料中…</div>

    <!-- 點擊日期 → 當日明細 -->
    <div class="dd-wrap" id="dayDetail" style="display:none">
      <div class="dd-hdr">
        <div class="dd-date-txt" id="ddDateTxt">—</div>
        <button class="dd-close" onclick="closeDayDetail()">✕</button>
      </div>
      <div class="dd-total">
        <span class="dd-total-l">當日估算總淨值</span>
        <span class="dd-total-v" id="ddTotal">—</span>
      </div>
      <div id="ddList"></div>
      <div class="dd-note" id="ddNote"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bnav">
  <button class="bn" id="bn0" onclick="setView('port')"><div class="bn-ico">📊</div>持股</button>
  <button class="bn" id="bn1" onclick="setView('cal')"><div class="bn-ico">📅</div>每日盈虧</button>
</div>
<button class="fab" id="fab" onclick="openModal()" style="display:none">＋</button>

<!-- 新增/編輯 MODAL -->
<div class="ov" id="hOv" onclick="bgc(event,'hOv')">
<div class="modal">
  <div class="mh"></div>
  <div class="mt" id="hTit">新增持股</div>
  <div class="fg"><label class="fl">市場</label>
    <div class="mkt-row">
      <button class="mb on" id="btnTW" onclick="setMkt('TW')">🇹🇼 台股 TWD</button>
      <button class="mb"    id="btnUS" onclick="setMkt('US')">🇺🇸 美股 USD</button>
    </div>
  </div>
  <div class="fg"><label class="fl">券商</label>
    <select class="fi" id="fBk">
      <option value="">請選擇券商…</option>
      <option value="永豐金">永豐金</option>
      <option value="群益">群益</option>
      <option value="元大">元大</option>
      <option value="其他">其他</option>
    </select>
  </div>
  <div class="fg"><label class="fl">股票代碼</label>
    <input class="fi" id="fTk" type="text" placeholder="台股：00685L　美股：NVDA" autocapitalize="characters" autocorrect="off" autocomplete="off">
    <div class="fi-hint">台股輸入數字/字母代碼（2330, 00662, 00685L…），美股輸入英文（NVDA, TSLA…）</div>
  </div>
  <div class="fg"><label class="fl">股票名稱</label>
    <input class="fi" id="fNm" type="text" placeholder="例：台積電、輝達"></div>
  <div class="fg"><label class="fl">持股數量（股）</label>
    <input class="fi" id="fSh" type="number" inputmode="decimal" placeholder="0（碎股請輸入小數，如 9.5479）"></div>
  <div class="fg"><label class="fl">平均成本（每股均價）</label>
    <input class="fi" id="fCo" type="number" inputmode="decimal" placeholder="0.00"></div>
  <div class="fg">
    <div class="trow" onclick="togM()">
      <div>
        <div style="font-size:15px;font-weight:500">融資部位</div>
        <div style="font-size:12px;color:var(--t2);margin-top:2px">開啟後填入券商借款金額</div>
      </div>
      <div class="sw" id="mSw"></div>
    </div>
  </div>
  <div class="fg hdn" id="lGrp">
    <label class="fl">融資借款金額（券商借你的錢）</label>
    <input class="fi" id="fLo" type="number" inputmode="numeric" placeholder="0">
    <div class="fi-hint">自投本金 = 持股數 × 均價 − 借款<br>自有淨值 = 市值 − 借款<br>損益 = 自有淨值 − 自投本金</div>
  </div>
  <div class="acts">
    <button class="btn bs" onclick="closeModal()">取消</button>
    <button class="btn bd hdn" id="delBtn" onclick="delH()">刪除</button>
    <button class="btn bp" onclick="saveH()">儲存</button>
  </div>
</div>
</div>

<!-- 設定 MODAL -->
<div class="ov" id="sOv" onclick="bgc(event,'sOv')">
<div class="modal">
  <div class="mh"></div>
  <div class="mt">設定</div>
  <div class="fg"><label class="fl">匯入持股資料（JSON 陣列）</label>
    <textarea class="fi" id="impJ" placeholder="貼上 JSON 陣列…"></textarea></div>
  <button class="btn bp" style="width:100%;margin-bottom:14px" onclick="doImport()">匯入</button>
  <hr class="divider">
  <div class="fg"><label class="fl">匯出目前持股</label>
    <textarea class="fi" id="expJ" readonly onclick="this.select()"></textarea></div>
  <button class="btn bs" style="width:100%;margin-bottom:14px" onclick="doExport()">產生匯出 JSON</button>
  <hr class="divider">
  <button class="btn bd" style="width:100%;margin-bottom:14px" onclick="clearAll()">清除所有資料</button>
  <button class="btn bs" style="width:100%" onclick="closeSettings()">關閉</button>
</div>
</div>

<script>
/* ══════════ STATE ══════════ */
const SK='portfolio_v4', CK='pnl_log_v2', HK='hist_loaded';
const PROX=[
  u=>u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
];
let H=[],P={},rate=null,editId=null,fMkt='TW',fMargin=false;
let curTab='all',curView='port',curPeriod=7;
let calY=new Date().getFullYear(),calM=new Date().getMonth();
let histData={},selDate=null; // for day-detail feature

/* ══════════ STORAGE ══════════ */
function load(){try{H=JSON.parse(localStorage.getItem(SK))||[];}catch{H=[];}}
function persist(){localStorage.setItem(SK,JSON.stringify(H));}
function getLog(){try{return JSON.parse(localStorage.getItem(CK))||{};}catch{return{};}}
function saveLog(l){localStorage.setItem(CK,JSON.stringify(l));}

/* ══════════ TICKER ══════════ */
function yt(h){return h.market==='TW'?h.ticker+'.TW':h.ticker;}

/* ══════════ FETCH SINGLE ══════════ */
function sig(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}

async function fetchOne(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=2d`;
  for(const px of PROX){
    try{
      const r=await fetch(px(url),{signal:sig(7000)});
      if(!r.ok)continue;
      const j=await r.json();
      const m=j.chart?.result?.[0]?.meta;
      if(!m||m.regularMarketPrice==null)continue;
      const curr=m.regularMarketPrice;
      const prev=m.chartPreviousClose??m.previousClose??m.regularMarketPreviousClose??curr;
      return{price:curr,prev,chg:curr-prev,chgPct:prev?((curr-prev)/prev*100):0,currency:m.currency};
    }catch{continue;}
  }
  return null;
}

/* ══════════ FETCH HISTORY (for calendar) ══════════ */
async function fetchHist(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=30d`;
  for(const px of PROX){
    try{
      const r=await fetch(px(url),{signal:sig(10000)});
      if(!r.ok)continue;
      const j=await r.json();
      const res=j.chart?.result?.[0];
      if(!res)continue;
      const ts=res.timestamp,closes=res.indicators?.quote?.[0]?.close;
      if(!ts||!closes)continue;
      return ts.map((t,i)=>({
        date:new Date(t*1000).toISOString().slice(0,10),
        close:closes[i]
      })).filter(d=>d.close!=null);
    }catch{continue;}
  }
  return null;
}

/* load 30d history into pnl_log */
async function loadHistory(){
  document.getElementById('calLoading').style.display='block';
  const syms=[...new Set(H.map(yt)),'USDTWD=X'];
  const histAll={};
  await Promise.all(syms.map(async s=>{
    const d=await fetchHist(s);
    if(d)histAll[s]=d;
  }));

  const rateArr=histAll['USDTWD=X']||[];
  const log=getLog();

  // collect all dates
  const dateSet=new Set();
  Object.values(histAll).forEach(arr=>arr.forEach(d=>dateSet.add(d.date)));
  const dates=[...dateSet].sort();

  for(let i=1;i<dates.length;i++){
    const today=dates[i],yesterday=dates[i-1];
    if(log[today])continue; // don't overwrite real data
    const rDay=rateArr.find(d=>d.date===today)?.close||(rate||0);
    let twdP=0,usdP=0;
    H.forEach(h=>{
      const hd=histAll[yt(h)];if(!hd)return;
      const c=hd.find(d=>d.date===today)?.close;
      const p=hd.find(d=>d.date===yesterday)?.close;
      if(c==null||p==null)return;
      const dp=(c-p)*h.shares;
      h.market==='TW'?twdP+=dp:usdP+=dp;
    });
    const total=Math.round(twdP+(rDay?usdP*rDay:0));
    if(Math.abs(total)>1)log[today]={pnl:total,ts:Date.now(),src:'hist'};
  }
  histData=histAll; // save globally for day-detail clicks
  saveLog(log);
  localStorage.setItem(HK,'1');
  document.getElementById('calLoading').style.display='none';
  renderCalendar();
}

/* ══════════ CALC (P&L = 淨值 − 自投本金 = mv - tc，不論融資非融資) ══════════ */
function calc(h){
  const pd=P[yt(h)];
  if(!pd)return{...h,pd:null,curr:null,mv:null,nv:null,tc:null,sf:null,pnl:null,pnlPct:null,dayAmt:null};
  const curr=pd.price,mv=h.shares*curr,tc=h.shares*h.avgCost;
  const loan=h.isMargin?(h.marginLoan||0):0;
  const sf=tc-loan,nv=mv-loan;
  // P&L = nv - sf = (mv-loan) - (tc-loan) = mv - tc
  const pnl=nv-sf,pnlPct=sf>0?pnl/sf*100:0;
  const dayAmt=(curr-pd.prev)*h.shares;
  return{...h,pd,curr,mv,nv,tc,sf,pnl,pnlPct,dayAmt};
}

/* ══════════ AGGREGATE ══════════ */
function agg(list){
  const map=new Map();
  list.forEach(h=>{
    const k=h.market+':'+h.ticker;
    if(!map.has(k)){map.set(k,{...h,id:'agg:'+k,_tc:h.shares*h.avgCost,_loan:h.marginLoan||0,_bk:new Set([h.broker])});}
    else{
      const e=map.get(k);
      e.shares+=h.shares;e._tc+=h.shares*h.avgCost;e._loan+=h.marginLoan||0;
      e.avgCost=e._tc/e.shares;e.marginLoan=e._loan;
      e.isMargin=e.isMargin||h.isMargin;e._bk.add(h.broker);
    }
  });
  return[...map.values()].map(e=>({...e,broker:[...e._bk].join('+')}));
}

/* ══════════ LOG TODAY ══════════ */
function logToday(){
  let twD=0,usD=0,has=false;
  H.map(calc).forEach(c=>{if(c.dayAmt==null)return;has=true;c.market==='TW'?twD+=c.dayAmt:usD+=c.dayAmt;});
  if(!has)return;
  const today=new Date().toISOString().slice(0,10);
  const log=getLog();
  log[today]={pnl:Math.round(twD+(rate?usD*rate:0)),ts:Date.now()};
  saveLog(log);
}

/* ══════════ FORMAT ══════════ */
function f(n,d=0){if(n==null||isNaN(n))return'—';return n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fp(n,d=2){return(n>=0?'+':'')+n.toFixed(d)+'%';}
function cc(n){return n>=0?'green':'red';}
function fk(n){if(n==null)return'—';const a=Math.abs(n);return(n>=0?'+':'-')+(a>=10000?(a/10000).toFixed(1)+'萬':f(a));}

/* ══════════ TOTALS
   KEY FIX: use sf (自投本金) as cost basis, not tc (總成本含借款)
   totalPnl = sum(nv) - sum(sf) = sum(mv-loan) - sum(tc-loan) = sum(mv-tc)
══════════ */
function getTotals(broker){
  const src=broker&&broker!=='all'?H.filter(h=>h.broker===broker):H;
  let twN=0,usN=0,twD=0,usD=0,twSF=0,usSF=0,has=false;
  src.map(calc).forEach(c=>{
    if(c.nv==null)return;has=true;
    if(c.market==='TW'){twN+=c.nv;twD+=c.dayAmt||0;twSF+=c.sf||0;}
    else{usN+=c.nv;usD+=c.dayAmt||0;usSF+=c.sf||0;}
  });
  const r=rate||0,grand=twN+usN*r,grandSF=twSF+usSF*r;
  return{twN,usN,grand,grandD:twD+usD*r,grandSF,totalPnl:grand-grandSF,has};
}

/* ══════════ CALENDAR ══════════ */
function setPeriod(p){
  curPeriod=p;
  document.querySelectorAll('.ps').forEach(b=>b.classList.toggle('on',String(b.dataset.p)===String(p)));

function periodPnl(days){
  const log=getLog(),today=new Date();let sum=0,cnt=0;
  const lim=days==='all'?3650:days;
  for(let i=0;i<lim;i++){const d=new Date(today);d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);if(log[k]){sum+=log[k].pnl;cnt++;}}
  return{sum,cnt};
}

function renderCalendar(){
  const log=getLog();
  const todayKey=new Date().toISOString().slice(0,10);
  const ta=getTotals(null);

  // 總未實現損益
  const tp=document.getElementById('csTotalPnl');
  if(ta.has){tp.textContent=`${ta.totalPnl>=0?'+':''}NT$ ${f(ta.totalPnl)}`;tp.className='cs-main '+cc(ta.totalPnl);}
  else{tp.textContent='—';tp.className='cs-main dim';}

  // 今日
  const te=log[todayKey];
  if(te){
    const td=te.pnl;
    document.getElementById('csTodayPnl').innerHTML=`<span class="${cc(td)}">${td>=0?'+':''}NT$ ${f(td)}</span>`;
    document.getElementById('csTodayPct').innerHTML=ta.grand?`<span class="${cc(td)}">${fp(td/ta.grand*100)}</span>`:'—';
  }else{document.getElementById('csTodayPnl').textContent='—';document.getElementById('csTodayPct').textContent='—';}

  // 期間小計
  const pd=periodPnl(curPeriod);
  document.getElementById('ptotalLbl').textContent=curPeriod==='all'?`全部（${pd.cnt} 天）`:`近 ${curPeriod} 天`;
  const pv=document.getElementById('ptotalVal');
  if(pd.cnt){pv.textContent=`${pd.sum>=0?'+':''}NT$ ${f(pd.sum)}`;pv.className='ptotal-v '+cc(pd.sum);}
  else{pv.textContent='尚無記錄';pv.className='ptotal-v dim';}

  // 月份
  const mN=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonth').textContent=`${calY} ${mN[calM]}`;

  // 日曆格子
  const fDow=new Date(calY,calM,1).getDay(),lastD=new Date(calY,calM+1,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  let g='<div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>';
  for(let i=0;i<fDow;i++)g+='<div></div>';
  for(let d=1;d<=lastD;d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const e=log[ds],isToday=ds===todayStr,isFuture=ds>todayStr,isSel=ds===selDate;
    let cls='cday';
    if(e)cls+=e.pnl>=0?' profit':' loss';
    if(isToday)cls+=' today';
    if(isSel)cls+=' sel';
    const ps=e?fk(e.pnl):'',pc=e?cc(e.pnl):'dim';
    const oc=isFuture?'':`onclick="clickDay('${ds}')"`;
    g+=`<div class="${cls}" ${oc}><div class="cday-n">${d}</div><div class="cday-p ${pc}">${ps}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML=g;
}

function showDayDetail(ds){
  const dd=document.getElementById('dayDetail');
  document.getElementById('ddDateTxt').textContent=ds+' 持股快照';

  // Use histData (loaded 30d window) or fall back to today's live prices
  const useHist=Object.keys(histData).length>0;
  const aggH=agg(H); // combine same ticker across brokers
  const rateArr=histData['USDTWD=X']||[];
  const rDay=rateArr.find(d=>d.date===ds)?.close||(rate||0);

  let rows=[],totalTWD=0,hasMissing=false;

  aggH.forEach(h=>{
    const sym=yt(h);
    let price=null;

    if(useHist){
      price=histData[sym]?.find(d=>d.date===ds)?.close??null;
    }
    // fallback: if it's today and we have live price
    const todayKey=new Date().toISOString().slice(0,10);
    if(price==null&&ds===todayKey&&P[sym]){price=P[sym].price;}

    if(price==null){hasMissing=true;return;}

    const mv=price*h.shares,tc=h.avgCost*h.shares;
    const loan=h.isMargin?(h.marginLoan||0):0;
    const nv=mv-loan,sf=tc-loan,pnl=nv-sf;
    const ccy=h.market==='US'?'$':'';
    const nvTWD=h.market==='US'?nv*(rDay||rate||0):nv;
    totalTWD+=nvTWD;

    const nlbl=h.isMargin?'淨值':'市值';
    const mBdg=h.isMargin?'<span class="bdg bdg-m" style="font-size:9px;margin-left:4px">融資</span>':'';
    rows.push(`<div class="dd-row">
      <div class="dd-l">
        <div><span class="dd-sym">${h.ticker}</span>${mBdg}</div>
        <div class="dd-nm">${h.name}</div>
        <div class="dd-nm">${f(h.shares,h.shares%1?5:0)} 股</div>
      </div>
      <div class="dd-r">
        <div class="dd-px">收盤 ${ccy}${f(price,2)}</div>
        <div class="dd-nv">${nlbl} ${ccy}${f(nv)}</div>
        <div class="dd-pnl ${cc(pnl)}">${pnl>=0?'+':''}${f(pnl)}</div>
      </div>
    </div>`);
  });

  document.getElementById('ddTotal').textContent=rows.length?`NT$ ${f(totalTWD)}`:'—';
  document.getElementById('ddTotal').className='dd-total-v '+(totalTWD>=0?'green':'red');
  document.getElementById('ddList').innerHTML=rows.length?rows.join(''):'<div class="dd-empty">此日期無歷史資料</div>';
  document.getElementById('ddNote').textContent=hasMissing?'部分持股無該日資料（未計入）':'';
  dd.style.display='block';
  setTimeout(()=>dd.scrollIntoView({behavior:'smooth',block:'start'}),80);
}
