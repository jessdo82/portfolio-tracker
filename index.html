<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>投資組合</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;
  --green:#30d158;--red:#ff453a;--blue:#0a84ff;--orange:#ff9f0a;
  --text:#fff;--t2:#8e8e93;--border:#38383a;
  --safe:env(safe-area-inset-bottom,0px)
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;padding-bottom:calc(60px + var(--safe))}

/* ── HEADER ── */
.hdr{padding:52px 20px 14px;background:#111}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.hdr-title{font-size:20px;font-weight:700}
.hdr-btns{display:flex;gap:8px}
.ico{background:var(--c2);border:none;color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ico.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.net-lbl{font-size:12px;color:var(--t2);margin-bottom:3px}
.net-amt{font-size:36px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.net-chg{font-size:14px;margin-top:5px;min-height:20px}
.net-upd{font-size:11px;color:var(--t2);margin-top:5px}

/* ── SUB CARDS ── */
.subs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sc{background:var(--c1);border-radius:10px;padding:10px 13px;min-width:120px;flex-shrink:0}
.sc-l{font-size:11px;color:var(--t2);margin-bottom:3px}
.sc-v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* ── TABS ── */
.tabs{display:flex;gap:7px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--c1);border:none;color:var(--t2);padding:6px 15px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.on{background:var(--blue);color:#fff}

/* ── PORTFOLIO LIST ── */
.list{padding:0 14px 8px}
.sec{font-size:11px;color:var(--t2);padding:14px 4px 7px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}

/* ── CARD ── */
.card{background:var(--c1);border-radius:14px;padding:14px 15px;margin-bottom:9px}
.card.tap{cursor:pointer}
.card.tap:active{opacity:.65}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.ct{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cs{font-size:17px;font-weight:700}
.bdg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.bdg-m{background:var(--orange);color:#000}
.bdg-a{background:var(--blue);color:#fff}
.cname{font-size:12px;color:var(--t2);margin-top:2px}
.cbkr{font-size:11px;color:var(--t2);background:var(--c2);padding:3px 8px;border-radius:5px;white-space:nowrap;max-width:90px;text-align:right;line-height:1.4}

/* price rows */
.pr{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0}
.pr-lbl{font-size:12px;color:var(--t2);min-width:38px}
.pr-val{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pr-val.sm{font-size:14px}
.pr-chg{font-size:13px;font-variant-numeric:tabular-nums}
.pr-cost{font-size:15px;font-weight:500;color:var(--t2);font-variant-numeric:tabular-nums}

/* metrics */
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;border-top:1px solid var(--border);padding-top:9px;margin-top:10px}
.ml{font-size:11px;color:var(--t2);margin-bottom:2px}
.mv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}

/* margin box */
.mbox{background:rgba(255,159,10,.07);border:1px solid rgba(255,159,10,.22);border-radius:8px;padding:9px 11px;margin-top:9px}
.mbox-title{font-size:11px;color:var(--orange);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.mrow{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;font-variant-numeric:tabular-nums}
.mrow.hl{font-weight:700;font-size:13px;border-top:1px solid rgba(255,159,10,.2);margin-top:4px;padding-top:6px}

.green{color:var(--green)}
.red{color:var(--red)}
.dim{color:var(--t2)}

/* ── EMPTY ── */
.empty{text-align:center;padding:70px 20px;color:var(--t2)}
.ei{font-size:48px;margin-bottom:14px}

/* ── CALENDAR VIEW ── */
#calView{display:none;padding:0 14px}
.period-bar{display:flex;gap:8px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.period-bar::-webkit-scrollbar{display:none}
.pcard{background:var(--c1);border-radius:10px;padding:10px 14px;min-width:100px;flex-shrink:0;text-align:center}
.pcard-l{font-size:11px;color:var(--t2);margin-bottom:4px}
.pcard-v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pcard-p{font-size:12px;margin-top:2px}

.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.cal-month{font-size:17px;font-weight:700}
.cal-nav{background:var(--c2);border:none;color:var(--blue);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:11px;color:var(--t2);text-align:center;padding:4px 0;font-weight:600}
.cal-day{border-radius:8px;min-height:54px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:var(--c1)}
.cal-day.empty-day{background:transparent}
.cal-day.today{outline:2px solid var(--blue)}
.cal-dn{font-size:12px;font-weight:600}
.cal-pnl{font-size:10px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.2}
.cal-day.profit{background:rgba(48,209,88,.12)}
.cal-day.loss{background:rgba(255,69,58,.12)}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe);z-index:50}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px;background:none;border:none;cursor:pointer;color:var(--t2);font-size:10px;font-weight:500}
.bn.on{color:var(--blue)}
.bn-ico{font-size:22px;line-height:1}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(70px + var(--safe));right:20px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(10,132,255,.45);display:flex;align-items:center;justify-content:center;z-index:60}

/* ── MODAL ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:flex-end}
.ov.open{display:flex}
.modal{background:#1c1c1e;border-radius:20px 20px 0 0;padding:6px 18px calc(24px + var(--safe));width:100%;max-height:94vh;overflow-y:auto}
.mh{width:38px;height:4px;background:var(--border);border-radius:2px;margin:11px auto 18px}
.mt{font-size:18px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:14px}
.fl{font-size:13px;color:var(--t2);margin-bottom:5px;display:block}
.fi{width:100%;background:var(--c2);border:none;border-radius:10px;padding:12px 13px;color:var(--text);font-size:16px;outline:none}
.fi:focus{outline:2px solid var(--blue)}
select.fi{appearance:none}
textarea.fi{resize:vertical;min-height:100px;font-size:13px;font-family:monospace}
.fi-hint{font-size:12px;color:var(--t2);margin-top:4px}
.mkt{display:flex;gap:8px}
.mb{flex:1;padding:11px;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--t2);font-size:15px;cursor:pointer;font-weight:500}
.mb.on{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,.08)}
.trow{display:flex;align-items:center;justify-content:space-between;background:var(--c2);padding:12px 13px;border-radius:10px;cursor:pointer}
.sw{width:51px;height:31px;background:var(--border);border-radius:16px;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--green)}
.sw::after{content:'';position:absolute;width:27px;height:27px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw.on::after{left:22px}
.hdn{display:none!important}
.acts{display:flex;gap:9px;margin-top:22px}
.btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.bp{background:var(--blue);color:#fff}
.bs{background:var(--c2);color:var(--text)}
.bd{background:var(--red);color:#fff}
.div{border:none;border-top:1px solid var(--border);margin:18px 0}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-row">
    <div class="hdr-title" id="hdrTitle">投資組合</div>
    <div class="hdr-btns">
      <button class="ico" id="refBtn" onclick="fetchPrices()" title="更新">↻</button>
      <button class="ico" onclick="openSettings()" title="設定">⚙</button>
    </div>
  </div>
  <div class="net-lbl" id="netLbl">總淨值（台幣）</div>
  <div class="net-amt" id="netAmt">—</div>
  <div class="net-chg" id="netChg"></div>
  <div class="net-upd" id="netUpd"></div>
</div>

<div class="subs" id="subs"></div>

<!-- BROKER TABS (portfolio view only) -->
<div class="tabs" id="brokerTabs"></div>

<!-- PORTFOLIO VIEW -->
<div id="portView">
  <div class="list" id="list"></div>
</div>

<!-- CALENDAR VIEW -->
<div id="calView">
  <div class="period-bar" id="periodBar"></div>
  <div class="cal-hdr">
    <button class="cal-nav" onclick="calNav(-1)">‹</button>
    <div class="cal-month" id="calMonth"></div>
    <button class="cal-nav" onclick="calNav(1)">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bnav">
  <button class="bn on" id="bn0" onclick="setView('port')"><div class="bn-ico">📊</div>持股</button>
  <button class="bn" id="bn1" onclick="setView('cal')"><div class="bn-ico">📅</div>每日盈虧</button>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openModal()">＋</button>

<!-- ── HOLDING MODAL ── -->
<div class="ov" id="hOv" onclick="bgc(event,'hOv')">
<div class="modal">
  <div class="mh"></div>
  <div class="mt" id="hTit">新增持股</div>

  <div class="fg"><label class="fl">市場</label>
    <div class="mkt">
      <button class="mb on" id="btnTW" onclick="setMkt('TW')">🇹🇼 台股 TWD</button>
      <button class="mb" id="btnUS" onclick="setMkt('US')">🇺🇸 美股 USD</button>
    </div>
  </div>

  <div class="fg"><label class="fl">券商</label>
    <select class="fi" id="fBk">
      <option value="">選擇券商…</option>
      <option value="永豐金">永豐金</option>
      <option value="群益">群益</option>
      <option value="元大">元大</option>
      <option value="其他">其他</option>
    </select>
  </div>

  <div class="fg"><label class="fl">股票代碼</label>
    <input class="fi" id="fTk" type="text" placeholder="台股：00662　美股：NVDA" autocapitalize="characters" autocorrect="off" autocomplete="off">
    <div class="fi-hint">台股直接輸入代碼（如 00685L），美股輸入英文代碼（如 NVDA）</div>
  </div>

  <div class="fg"><label class="fl">股票名稱</label>
    <input class="fi" id="fNm" type="text" placeholder="例：富邦NASDAQ">
  </div>

  <div class="fg"><label class="fl">持股數量</label>
    <input class="fi" id="fSh" type="number" inputmode="decimal" placeholder="0（小數可輸入碎股，如 9.5479）">
  </div>

  <div class="fg"><label class="fl">平均成本（每股）</label>
    <input class="fi" id="fCo" type="number" inputmode="decimal" placeholder="0.00">
  </div>

  <div class="fg">
    <div class="trow" onclick="togM()">
      <div>
        <div style="font-size:15px;font-weight:500">融資部位</div>
        <div style="font-size:12px;color:var(--t2);margin-top:2px">開啟後請填入券商借款金額</div>
      </div>
      <div class="sw" id="mSw"></div>
    </div>
  </div>

  <div class="fg hdn" id="lGrp">
    <label class="fl">融資借款金額（券商借你的錢）</label>
    <input class="fi" id="fLo" type="number" inputmode="numeric" placeholder="0">
    <div class="fi-hint">
      計算公式：市值 − 融資借款 = 自有淨值<br>
      自投本金 = 持股數 × 平均成本 − 融資借款
    </div>
  </div>

  <div class="acts">
    <button class="btn bs" onclick="closeModal()">取消</button>
    <button class="btn bd hdn" id="delBtn" onclick="delH()">刪除</button>
    <button class="btn bp" onclick="saveH()">儲存</button>
  </div>
</div>
</div>

<!-- ── SETTINGS MODAL ── -->
<div class="ov" id="sOv" onclick="bgc(event,'sOv')">
<div class="modal">
  <div class="mh"></div>
  <div class="mt">設定</div>
  <div class="fg"><label class="fl">匯入資料（貼上 JSON）</label><textarea class="fi" id="impJ" placeholder="貼上 JSON 陣列…"></textarea></div>
  <button class="btn bp" style="width:100%;margin-bottom:14px" onclick="doImport()">匯入</button>
  <hr class="div">
  <div class="fg"><label class="fl">匯出目前資料</label><textarea class="fi" id="expJ" readonly onclick="this.select()"></textarea></div>
  <button class="btn bs" style="width:100%;margin-bottom:14px" onclick="doExport()">產生匯出 JSON</button>
  <hr class="div">
  <button class="btn bd" style="width:100%;margin-bottom:14px" onclick="clearAll()">清除所有資料（重新開始）</button>
  <button class="btn bs" style="width:100%" onclick="closeSettings()">關閉</button>
</div>
</div>

<script>
/* ── STATE ── */
const SK='portfolio_v3', CK='pnl_log';
const PROXIES=[
  u=>u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
];
let H=[],P={},rate=null,editId=null,fMkt='TW',fMargin=false,curTab='all',curView='port';
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();

/* ── STORAGE ── */
function load(){try{H=JSON.parse(localStorage.getItem(SK))||[];}catch(e){H=[];}}
function persist(){localStorage.setItem(SK,JSON.stringify(H));}
function getPnlLog(){try{return JSON.parse(localStorage.getItem(CK))||{};}catch(e){return{};}}
function savePnlLog(log){localStorage.setItem(CK,JSON.stringify(log));}

/* ── YAHOO FINANCE TICKER ── */
function yt(h){return h.market==='TW'?h.ticker+'.TW':h.ticker;}

/* ── PRICE FETCH ── */
function mkSig(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}

async function fetchOne(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=2d`;
  for(const px of PROXIES){
    try{
      const r=await fetch(px(url),{signal:mkSig(7000)});
      if(!r.ok)continue;
      const j=await r.json();
      const m=j.chart?.result?.[0]?.meta;
      if(!m||!m.regularMarketPrice)continue;
      const prev=m.chartPreviousClose??m.previousClose??m.regularMarketPreviousClose;
      const curr=m.regularMarketPrice;
      return{price:curr,prev:prev??curr,chg:curr-(prev??curr),chgPct:prev?((curr-prev)/prev*100):0,currency:m.currency,state:m.marketState};
    }catch{continue;}
  }
  return null;
}

async function fetchPrices(){
  if(!H.length)return;
  const btn=document.getElementById('refBtn');
  btn.classList.add('spin');
  document.getElementById('netUpd').textContent='更新中…';
  const syms=[...new Set(H.map(yt)),'USDTWD=X'];
  const res=await Promise.all(syms.map(s=>fetchOne(s).then(d=>[s,d])));
  P={};
  res.forEach(([s,d])=>{if(d)P[s]=d;});
  rate=P['USDTWD=X']?.price||null;
  const ok=res.filter(([,d])=>d!=null).length;
  document.getElementById('netUpd').textContent=`更新：${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}（${ok}/${syms.length}）`;
  btn.classList.remove('spin');
  logToday();
  render();
}

/* ── CALC ── */
function calc(h){
  const pd=P[yt(h)];
  if(!pd||pd.price==null)return{...h,pd:null,curr:null,mv:null,nv:null,tc:null,sf:null,pnl:null,pnlPct:null,dayAmt:null};
  const curr=pd.price,mv=h.shares*curr,tc=h.shares*h.avgCost;
  const sf=h.isMargin?tc-h.marginLoan:tc;
  const nv=h.isMargin?mv-h.marginLoan:mv;
  const pnl=mv-tc,pnlPct=sf>0?pnl/sf*100:0;
  const dayAmt=(curr-(pd.prev??curr))*h.shares;
  return{...h,pd,curr,mv,nv,tc,sf,pnl,pnlPct,dayAmt};
}

/* ── AGGREGATE ── */
function agg(list){
  const map=new Map();
  list.forEach(h=>{
    const k=h.market+':'+h.ticker;
    if(!map.has(k)){
      map.set(k,{...h,id:'agg:'+k,_tc:h.shares*h.avgCost,_loan:h.marginLoan||0,_bkrs:new Set([h.broker])});
    }else{
      const e=map.get(k),addTc=h.shares*h.avgCost;
      e.shares+=h.shares;e._tc+=addTc;e._loan+=(h.marginLoan||0);
      e.avgCost=e._tc/e.shares;e.marginLoan=e._loan;
      e.isMargin=e.isMargin||h.isMargin;e._bkrs.add(h.broker);
    }
  });
  return[...map.values()].map(e=>({...e,broker:[...e._bkrs].join('、')}));
}

/* ── FORMAT ── */
function f(n,d=0){if(n==null||isNaN(n))return'—';return n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fp(n,d=2){if(n==null)return'';return(n>=0?'+':'')+n.toFixed(d)+'%';}
function cc(n){return n==null?'':n>=0?'green':'red';}

/* ── LOG TODAY P&L ── */
function logToday(){
  const calced=H.map(calc);
  let twdD=0,usdD=0,has=false;
  calced.forEach(c=>{if(c.dayAmt==null)return;has=true;c.market==='TW'?twdD+=c.dayAmt:usdD+=c.dayAmt;});
  if(!has)return;
  const total=twdD+(rate?usdD*rate:0);
  const today=new Date().toISOString().slice(0,10);
  const log=getPnlLog();
  log[today]={pnl:Math.round(total),ts:Date.now()};
  savePnlLog(log);
}

/* ── RENDER MAIN ── */
function render(){
  renderHeader();
  renderSubs();
  renderTabs();
  if(curView==='port')renderList();
  else renderCalendar();
}

/* ── HEADER ── */
function renderHeader(){
  const brokerFilter=curTab==='all'?null:curTab;
  const src=brokerFilter?H.filter(h=>h.broker===brokerFilter):H;
  const calced=src.map(calc);
  let twN=0,usN=0,twD=0,usD=0,has=false;
  calced.forEach(c=>{if(c.nv==null)return;has=true;if(c.market==='TW'){twN+=c.nv;twD+=c.dayAmt||0;}else{usN+=c.nv;usD+=c.dayAmt||0;}});
  const r=rate||0,grand=twN+usN*r,grandD=twD+usD*r;
  document.getElementById('netLbl').textContent=brokerFilter?`${brokerFilter}淨值（台幣）`:'總淨值（台幣）';
  document.getElementById('netAmt').textContent=has?`NT$ ${f(grand)}`:'—';
  document.getElementById('netChg').innerHTML=has&&grandD!==0?`<span class="${cc(grandD)}">今日 ${grandD>=0?'+':''}${f(grandD)} (${fp(grand?grandD/grand*100:0)})</span>`:'';
}

/* ── SUBS ── */
function renderSubs(){
  const calced=H.map(calc);
  let twN=0,usN=0,has=false;
  calced.forEach(c=>{if(c.nv==null)return;has=true;c.market==='TW'?twN+=c.nv:usN+=c.nv;});
  document.getElementById('subs').innerHTML=[

/* ── CARD ── */
function cardHtml(c,isAgg){
  const cur=c.market==='US'?'$':'';
  const ccy=c.market==='US'?'US$ ':'';
  const dec=c.shares%1!==0?5:0;

  // price area
  const priceStr=c.curr!=null?`${cur}${f(c.curr,2)}`:'—';
  const dayStr=c.pd?`<span class="${cc(c.pd.chg)}">${c.pd.chg>=0?'+':''}${f(c.pd.chg,2)} (${fp(c.pd.chgPct)})</span>`:'<span class="dim">未載入</span>';
  const costStr=`${cur}${f(c.avgCost,2)}`;

  // badges
  const mBadge=c.isMargin?'<span class="bdg bdg-m">融資</span>':'';
  const aBadge=isAgg?'<span class="bdg bdg-a">合計</span>':'';

  // metrics
  const netLabel=c.isMargin?'淨值':'市值';
  const netVal=c.nv!=null?`${ccy}${f(c.nv)}`:'—';
  const pnlVal=c.pnl!=null?`<span class="${cc(c.pnl)}">${c.pnl>=0?'+':''}${f(c.pnl)}</span>`:'—';
  const pnlPctStr=c.pnlPct!=null?`<br><span class="${cc(c.pnlPct)}" style="font-size:11px">${fp(c.pnlPct)}</span>`:'';

  // margin box
  let mbox='';
  if(c.isMargin){
    const selfFunded=c.sf!=null?f(c.sf):'—';
    const mv=c.mv!=null?f(c.mv):'—';
    const nv=c.nv!=null?f(c.nv):'—';
    const loan=f(c.marginLoan);
    mbox=`<div class="mbox">
      <div class="mbox-title">融資詳情</div>
      <div class="mrow"><span>自投本金</span><span>${selfFunded}</span></div>
      <div class="mrow"><span>融資借款</span><span class="red">${loan}</span></div>
      <div class="mrow"><span>市值</span><span>${mv}</span></div>
      <div class="mrow hl"><span>自有淨值</span><span>${nv}</span></div>
    </div>`;
  }

  const tapCls=isAgg?'':'tap';
  const onclick=isAgg?'':`onclick="openModal('${c.id}')"`;

  return `<div class="card ${tapCls}" ${onclick}>
    <div class="ch">
      <div>
        <div class="ct"><span class="cs">${c.ticker}</span>${mBadge}${aBadge}</div>
        <div class="cname">${c.name}</div>
      </div>
      <div class="cbkr">${c.broker}</div>
    </div>
    <div class="pr">
      <span class="pr-lbl">今日</span>
      <span class="pr-val">${priceStr}</span>
      <span class="pr-chg">&nbsp;${dayStr}</span>
    </div>
    <div class="pr">
      <span class="pr-lbl">成本</span>
      <span class="pr-cost">${costStr}</span>
    </div>
    <div class="metrics">
      <div><div class="ml">持股數</div><div class="mv">${f(c.shares,dec)}</div></div>
      <div><div class="ml">${netLabel}</div><div class="mv">${netVal}</div></div>
      <div><div class="ml">損益</div><div class="mv">${pnlVal}${pnlPctStr}</div></div>
    </div>
    ${mbox}
  </div>`;
}

/* ── LIST ── */
function renderList(){

  let src,isAgg=false;

    (tw.length?`<div class="sec">台股</div>${tw.map(c=>cardHtml(c,isAgg)).join('')}`:'')
    +(us.length?`<div class="sec">美股</div>${us.map(c=>cardHtml(c,isAgg)).join('')}`:'');
}

/* ── CALENDAR ── */
function renderCalendar(){
  const log=getPnlLog();
  const days=Object.keys(log);

  // Period bar
  const today=new Date();
  function periodPnl(n){
    let sum=0;
    for(let i=0;i<n;i++){
      const d=new Date(today);d.setDate(d.getDate()-i);
      const k=d.toISOString().slice(0,10);
      if(log[k])sum+=log[k].pnl;
    }
    return sum;
  }
  const p1=periodPnl(1),p7=periodPnl(7),p30=periodPnl(30);
  const [twN,usN]=getTotals();
  const grand=twN+(rate||0)*usN;

  document.getElementById('periodBar').innerHTML=[
    periodCard('今日',p1,grand),
    periodCard('7天',p7,grand),
    periodCard('30天',p30,grand),
    periodCard('全部',days.reduce((s,k)=>s+(log[k]?.pnl||0),0),grand),
  ].join('');

  // Month label
  const mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonth').textContent=`${calYear} ${mNames[calMonth]}`;

  // Grid
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const lastDate=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=today.toISOString().slice(0,10);
  let g='<div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>';
  for(let i=0;i<firstDay;i++)g+='<div class="cal-day empty-day"></div>';
  for(let d=1;d<=lastDate;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const entry=log[ds];
    const isToday=ds===todayStr;
    const cls=entry?(entry.pnl>=0?'profit':'loss'):'';
    const pnlStr=entry?(entry.pnl>=0?'+':'')+formatK(entry.pnl):'';
    const pnlCls=entry?(entry.pnl>=0?'green':'red'):'dim';
    g+=`<div class="cal-day ${cls}${isToday?' today':''}">
      <div class="cal-dn${isToday?' '+cc(1):''}">${d}</div>
      <div class="cal-pnl ${pnlCls}">${pnlStr}</div>
    </div>`;
  }
  document.getElementById('calGrid').innerHTML=g;
}

function periodCard(lbl,pnl,grand){
  const pct=grand?pnl/grand*100:0;
  return `<div class="pcard">
    <div class="pcard-l">${lbl}</div>
    <div class="pcard-v ${cc(pnl)}">${pnl>=0?'+':''}${f(pnl)}</div>
    <div class="pcard-p ${cc(pct)}">${fp(pct)}</div>
  </div>`;
}
function formatK(n){if(Math.abs(n)>=10000)return(n/10000).toFixed(1)+'萬';return f(n);}
function getTotals(){
  const calced=H.map(calc);
  let twN=0,usN=0;
  calced.forEach(c=>{if(c.nv==null)return;c.market==='TW'?twN+=c.nv:usN+=c.nv;});
  return[twN,usN];
}
function calNav(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}else if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}

/* ── MODAL ── */
function openModal(id=null){
  editId=id;
  document.getElementById('hTit').textContent=id?'編輯持股':'新增持股';
  document.getElementById('delBtn').classList.toggle('hdn',!id);
  if(id){
    const h=H.find(x=>x.id===id);if(!h)return;
    setMkt(h.market);
    document.getElementById('fBk').value=h.broker;
    document.getElementById('fTk').value=h.ticker;
    document.getElementById('fNm').value=h.name;
    document.getElementById('fSh').value=h.shares;
    document.getElementById('fCo').value=h.avgCost;
    fMargin=h.isMargin;document.getElementById('fLo').value=h.isMargin?h.marginLoan:'';
  }else{
    setMkt('TW');
    document.getElementById('fBk').value='';
    ['fTk','fNm','fSh','fCo','fLo'].forEach(i=>document.getElementById(i).value='');
    fMargin=false;
  }
  updM();document.getElementById('hOv').classList.add('open');
}
function closeModal(){document.getElementById('hOv').classList.remove('open');editId=null;}
function setMkt(m){fMkt=m;document.getElementById('btnTW').classList.toggle('on',m==='TW');document.getElementById('btnUS').classList.toggle('on',m==='US');}
function togM(){fMargin=!fMargin;updM();}
function updM(){document.getElementById('mSw').classList.toggle('on',fMargin);document.getElementById('lGrp').classList.toggle('hdn',!fMargin);}

function saveH(){
  const bk=document.getElementById('fBk').value,tk=document.getElementById('fTk').value.trim().toUpperCase();
  const nm=document.getElementById('fNm').value.trim(),sh=parseFloat(document.getElementById('fSh').value);
  const co=parseFloat(document.getElementById('fCo').value),lo=fMargin?(parseFloat(document.getElementById('fLo').value)||0):0;
  if(!bk||!tk||!nm||isNaN(sh)||sh<=0||isNaN(co)||co<=0){alert('請填寫所有必填欄位');return;}
  const e={broker:bk,ticker:tk,name:nm,market:fMkt,shares:sh,avgCost:co,isMargin:fMargin,marginLoan:lo};
  if(editId){const i=H.findIndex(h=>h.id===editId);if(i!==-1)H[i]={...H[i],...e};}
  else H.push({id:Date.now()+'-'+Math.random().toString(36).substr(2,5),...e});
  persist();closeModal();render();fetchPrices();
}
function delH(){if(!editId||!confirm('確定要刪除這筆持股？'))return;H=H.filter(h=>h.id!==editId);persist();closeModal();render();}
